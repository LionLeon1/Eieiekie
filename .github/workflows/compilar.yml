name: Crear APK Android
on:
  push:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar archivos del repositorio
        uses: actions/checkout@v4

      - name: Descomprimir cualquier ZIP subido
        run: |
          FILE=$(ls *.zip | head -n 1)
          echo "Descomprimiendo $FILE"
          unzip -o "$FILE"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Construir el archivo APK
        run: |
          cd SynthesiscoAndroidApp
          gradle assembleDebug --no-daemon

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-APK
          path: SynthesiscoAndroidApp/app/build/outputs/apk/debug/app-debug.apk
